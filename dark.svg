  <circle cx="1000" cy="480" r="300" fill="url(#halo)" opacity=".55"><animate attributeName="cy" values="480;450;480" dur="22s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="1178" height="608" rx="24" fill="none" stroke="#29435a" stroke-width="1.5"/>
