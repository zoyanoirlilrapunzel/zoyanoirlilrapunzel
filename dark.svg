<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1180" height="610" viewBox="0 0 1180 610" role="img"
 aria-label="GitHub profile for Zoya, a CSE-DS student interested in software development, data science, and product design.">
 <title>Zoya | Engineering Profile</title>
 <desc>A terminal-inspired profile banner with a character-rendered portrait, student identity, technical focus, and selected tools.</desc>
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#07111f"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d30" stop-opacity=".92"/><stop offset="1" stop-color="#0b1424" stop-opacity=".74"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".18"/></filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8aa8c4" stroke-opacity=".07" stroke-width="1"/></pattern>
  <clipPath id="portraitClip"><rect x="48" y="135" width="354" height="320" rx="12"/></clipPath>
  <clipPath id="heroClip"><rect x="1" y="1" width="1178" height="608" rx="24"/></clipPath>
 </defs>
 <g clip-path="url(#heroClip)">
