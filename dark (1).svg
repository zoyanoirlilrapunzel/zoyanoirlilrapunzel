  <title id="title">Zoyabi Shaikh — GitHub profile</title>
  <desc id="desc">A terminal-inspired profile banner for Zoyabi Shaikh, a Computer Science and Engineering student specializing in Data Science, with a character-rendered portrait, technical focus, selected projects, toolkit and GitHub links.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B16"/><stop offset="1" stop-color="#0A1730"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset=".52" stop-color="#5DE4F2"/><stop offset="1" stop-color="#52D6A4"/>
      <animate attributeName="x1" values="0;0.2;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5DE4F2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5DE4F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="portraitFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".0"/>
      <stop offset=".18" stop-color="#FFFFFF" stop-opacity=".0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#17304A" stroke-width=".65" opacity=".65"/>
    </pattern>
    <clipPath id="portraitClip"><rect x="48" y="126" width="390" height="392" rx="12"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .ascii { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; letter-spacing: 1.8px; fill: #9DB0C7; }
      .value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; fill: #F3F8FF; }
      .small { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #9DB0C7; }
      .heading { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; fill: #F3F8FF; }
    </style>
  </defs>

